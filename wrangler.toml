name = "heymia"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

[vars]
PUBLIC_DOMAIN = "https://heymia.lensflow.au"
GEMINI_MODEL = "gemini-3.8-flash"
COMMERCIAL = "1"

# Secrets (do not put values here):
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put LIVEAVATAR_API_KEY
#   wrangler secret put HF_TOKEN
#
# Bindings — set IDs in the dashboard or uncomment after create:
#   wrangler kv namespace create MEMORY
#   wrangler r2 bucket create heymia-vault
#
# [[kv_namespaces]]
# binding = "MEMORY"
# id = "your-kv-namespace-id"
#
# R2 is off. Saves download in the browser instead of writing the vault.
# Put this block back only after the account has clicked Enable R2 and the
# bucket heymia-vault exists. Until then a VAULT binding returns error 10042.
# [[r2_buckets]]
# binding = "VAULT"
# bucket_name = "heymia-vault"
